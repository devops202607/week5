apiVersion: v1
kind: Pod
metadata:
  name: multi-containers
  namespace: week5-5
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
    - name: debian
      image: debian
      command:
        - sh
        - -c
        - while true; do echo "$(date)" >> /data/index.html; sleep 5; done
      volumeMounts:
        - name: shared-data
          mountPath: /data
  volumes:
    - name: shared-data
      emptyDir: {}
