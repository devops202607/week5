---
apiVersion: v1
kind: Secret
metadata:
  name: mysecret1
type: Opaque
data:
  username: "dXNlcm5hbWU="
  password: "cGFzc3dvcmQ="
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-env
spec:
  containers:
    - name: mycontainer
      image: redis
      env:
        - name: SECRET_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysecret1
              key: username
        - name: SECRET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysecret1
              key: password
  restartPolicy: Never
