---
apiVersion: v1
kind: Secret
metadata:
  name: simple-secret
type: Opaque
data:
  foo: "YmFy"
---
apiVersion: v1
kind: Pod
metadata:
  name: secret
spec:
  containers:
    - name: mypod
      image: redis
      volumeMounts:
        - name: foo
          mountPath: "/etc/foo"
          readOnly: true
  volumes:
    - name: foo
      secret:
        secretName: simple-secret
