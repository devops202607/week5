apiVersion: v1
kind: Secret
metadata:
  name: simple-secret
  namespace: week5-5
type: Opaque
stringData:
  data.txt: hello-secret
---
apiVersion: v1
kind: Pod
metadata:
  name: secret
  namespace: week5-5
spec:
  containers:
    - name: secret
      image: redis
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secret
  volumes:
    - name: secret-volume
      secret:
        secretName: simple-secret
